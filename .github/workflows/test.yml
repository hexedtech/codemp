name: test

on:
  push:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --format json --report-time | tee result.json
      - uses: innoq/action-cargo-test-report@v1
        id: cargo_reporter 
        with:
          cargo-test-report-json: 'results.json'
      - uses: mikepenz/action-junit-report@main
        if: always()
        with:
          check_name: Unit+Doc tests report
          fail_on_failure: true
          require_tests: true
          summary: ${{ steps.cargo_reporter.outputs.summary }}

  test-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --features=serialize

  test-beta:
    runs-on: ubuntu-latest
    needs: [test-unit]
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - beta
          - nightly
    steps:
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --format json --report-time | tee result.json
      - uses: innoq/action-cargo-test-report@v1
        id: cargo_reporter 
        with:
          cargo-test-report-json: 'result.json'
      - uses: mikepenz/action-junit-report@main
        if: always()
        with:
          check_name: Beta+Nightly tests report
          fail_on_failure: true
          require_tests: true
          summary: ${{ steps.cargo_reporter.outputs.summary }}

  test-build:
    needs: [test-unit]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        features:
          - java
          - js
          - py
          - lua
    steps:
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose --features=${{ matrix.features }}

  test-functional:
    needs: [test-build]
    runs-on: ubuntu-latest
    steps:
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --format json --report-time --features=test-e2e tests::e2e | tee result.json
        env:
          CODEMP_TEST_USERNAME_ALICE: ${{ secrets.CODEMP_TEST_USERNAME_ALICE }}
          CODEMP_TEST_PASSWORD_ALICE: ${{ secrets.CODEMP_TEST_PASSWORD_ALICE }}
          CODEMP_TEST_USERNAME_BOB: ${{ secrets.CODEMP_TEST_USERNAME_BOB }}
          CODEMP_TEST_PASSWORD_BOB: ${{ secrets.CODEMP_TEST_PASSWORD_BOB }}
      - uses: innoq/action-cargo-test-report@v1
        id: cargo_reporter 
        with:
          cargo-test-report-json: 'result.json'
      - uses: mikepenz/action-junit-report@main
        if: always()
        with:
          check_name: Functional tests report
          fail_on_failure: true
          require_tests: true
          summary: ${{ steps.cargo_reporter.outputs.summary }}

  test-coverage:
    needs: [test-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - java
          - js
          - py
          - lua
    steps:
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --format json --report-time --no-default-features --features=${{ matrix.features }},test-coverage,py-abi3,lua-jit tests::coverage | tee result.json
      - uses: innoq/action-cargo-test-report@v1
        id: cargo_reporter 
        with:
          cargo-test-report-json: 'result.json'
      - uses: mikepenz/action-junit-report@main
        if: always()
        with:
          check_name: FFI Coverage tests report
          fail_on_failure: true
          require_tests: true
          summary: ${{ steps.cargo_reporter.outputs.summary }}

