[package]
name = "codemp"
description = "codemp -- code multiplexer"
homepage = "https://code.mp"
repository = "https://github.com/hexedtech/codemp"
authors = [
	"alemi <me@alemi.dev>",
	"zaaarf <me@zaaarf.foo>",
	"frelodev <frelodev@gmail.com>",
	"cschen <dev@cschen.cc>"
]
license = "GPL-3.0-only"
edition = "2024"
version = "0.8.5"
exclude = ["dist/*"]

[lints]
rust.unsafe_code = "warn"
rust.missing_docs = "warn"
clippy.unwrap_used = "warn"
clippy.collapsible_if = "allow"

[lib]
name = "codemp"
crate-type = ["cdylib", "rlib"]

[dependencies]
# core
tracing = "0.1"
thiserror = "2.0"
# crdt
diamond-types = { version = "1.0", optional = true }
yrs = { version = "0.26", optional = true }
# proto
codemp-proto = { git = "https://github.com/hexedtech/codemp-proto", rev = "6b45fd7bd7c03ef60234880c59157481def4ca71", optional = true }
# api
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# client
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"], optional = true }
tonic = { version = "0.14", features = ["tls-native-roots"], optional = true }
tokio-stream = { version = "0.1", optional = true }
dashmap = { version = "6.1", optional = true }

# glue (multiple)
tracing-subscriber = { version = "0.3", optional = true }

# glue (java)
jni = { version = "0.22", features = ["invocation"], optional = true }
#jni-toolbox = { version = "0.2", optional = true, features = ["uuid"] }
jni-toolbox = { git = "https://github.com/hexedtech/jni-toolbox", rev = "9b54289d562f3ba0dfc59ab38342e7502aeb529c", optional = true, features = ["uuid", "unsigned"] }

# glue (lua)
mlua = { version = "0.11", features = ["module", "serialize", "error-send"], optional = true }
mlua-serde-derive = { version = "0.1.1", optional = true }

# glue (js)
napi = { version = "3.1", features = ["full"], optional = true } 
napi-derive = { version="3.1",  optional = true}

# glue (python)
pyo3 = { version = "0.28", features = ["multiple-pymethods", "experimental-inspect"], optional = true}


# extra
async-trait = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
syn = { version = "2.0", features = ["full"], optional = true }
regex = { version = "1.12", optional = true }
uuid = { version = "1.17", features = ["v4"], optional = true }


[build-dependencies]
# glue (js)
napi-build = { version = "2.2", optional = true }
# glue (python)
pyo3-build-config = { version = "0.28", optional = true }
pyo3-introspection = { version = "0.28", optional = true }

[features]
default = ["lua-jit", "py-abi3", "py-extmod"]
proto = ["dep:codemp-proto"]
client = ["proto", "dep:tonic", "dep:tokio", "dep:tokio-stream", "dep:dashmap", "codemp-proto?/client"]
server = ["proto", "codemp-proto?/server"]
# crdt engine
dt-crdt = ["dep:diamond-types"]
y-crdt = ["dep:yrs"]
# extra
async-trait = ["dep:async-trait"]
serialize = ["dep:serde", "uuid?/serde"]
# special tests which require more setup
test-e2e = ["client", "dep:uuid"]
test-coverage = ["dep:syn", "dep:regex"]
# ffi
java = ["client", "dep:jni", "dep:tracing-subscriber", "dep:jni-toolbox", "codemp-proto/java"]
js = ["client", "dep:napi-build", "dep:tracing-subscriber", "dep:napi", "dep:napi-derive", "codemp-proto/js"]
py = ["client", "dep:pyo3", "dep:tracing-subscriber", "dep:pyo3-build-config", "dep:pyo3-introspection", "codemp-proto/py"]
lua = ["client", "serialize", "dep:mlua", "dep:mlua-serde-derive", "dep:tracing-subscriber", "dep:uuid", "codemp-proto/lua"]
# ffi variants
lua-jit = ["mlua?/luajit"]
lua-54 = ["mlua?/lua54"]
py-abi3 = ["pyo3?/abi3-py38"]
py-extmod = ["pyo3?/extension-module"]
# enables ci-specific stuff
ci = []


[package.metadata.docs.rs] # enabled features when building on docs.rs
features = ["client", "serialize"]

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = 'symbols'
